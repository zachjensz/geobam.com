<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="GeoBam" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafaf7" />
    <meta name="description" content="Learn countries and geography through focused, adaptive minigames that work offline." />
    <title>GeoBam — Learn the world</title>
    <style>
      html {
        background: #fafaf7;
      }
      #app .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .boot-mark {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: conic-gradient(#527785 0 40%, #c3a16d 40% 60%, #527785 60%);
        box-shadow: 0 0 0 2px #fafaf7, 0 0 0 4px #1f5547;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Loading GeoBam">
        <span class="boot-mark" aria-hidden="true"></span>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; color: #24352f; text-align: center; padding: 2rem;">
        GeoBam needs JavaScript to draw its maps. Please enable JavaScript and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
